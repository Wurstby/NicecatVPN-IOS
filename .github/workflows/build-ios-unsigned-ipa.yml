name: Build iOS unsigned IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/NicecatVPN
        run: xcodegen generate

      - name: Build without signing
        working-directory: ios/NicecatVPN
        run: |
          set -euo pipefail
          xcodebuild \
            -project NicecatVPN.xcodeproj \
            -scheme NicecatVPN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios/NicecatVPN
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'NicecatVPN.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf build/Payload build/NicecatVPN-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry NicecatVPN-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NicecatVPN-unsigned-ipa
          path: ios/NicecatVPN/build/NicecatVPN-unsigned.ipa
